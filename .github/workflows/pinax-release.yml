name: Pinax Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_TEST_TIMEOUT: 30m

jobs:
  check:
    name: task check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-check.yml
  snapshot:
    name: snapshot build (no release)
    if: github.event_name == 'workflow_dispatch'
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-snapshot.yml
  release:
    name: publish tagged release
    if: github.event_name == 'push'
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-publish.yml
    secrets: inherit
