name: Pinax CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinax-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_TEST_TIMEOUT: 30m

jobs:
  check:
    name: task ci (check + race + release check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Run quality gate
        run: task ci
