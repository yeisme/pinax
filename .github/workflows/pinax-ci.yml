name: Pinax CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

env:
  GO_TEST_TIMEOUT: 30m

jobs:
  check:
    name: task ci (check + race + release check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Run quality gate
        run: task ci
