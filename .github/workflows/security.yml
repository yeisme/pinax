# Copy to <product>/.github/workflows/security.yml
# Pin: google/osv-scanner v2.5.1 (2026-08-17). Bump in the owning OpenSpec, not ad hoc.
#
# Stagger cron per product (UTC), examples:
#   eikona    17 4 * * 1
#   pinax     27 4 * * 1
#   auctra    37 4 * * 1
#   scaena    47 4 * * 1
#   gitea-mcp 57 4 * * 1
name: Security

on:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OSV-Scanner v2.5.1
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  /tmp/osv-scanner" | sha256sum -c -
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan lockfiles
        continue-on-error: true
        run: |
          mkdir -p temp/security
          osv-scanner scan --recursive \
            --format sarif \
            --output temp/security/osv.sarif \
            --format table \
            .

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-${{ github.run_id }}
          path: temp/security/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('temp/security/osv.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: temp/security/osv.sarif
          category: osv-scanner
